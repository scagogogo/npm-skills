name: Go Tests

# 控制工作流何时运行
on:
  # 在推送到任何分支或创建 pull request 时触发
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  # 允许手动触发工作流
  workflow_dispatch:

# 一个工作流由一个或多个作业组成，这些作业可以顺序或并行运行
jobs:
  # 这个工作流包含一个名为 "test" 的作业
  test:
    # 运行作业的操作系统
    runs-on: ubuntu-latest

    # 步骤代表作业中执行的一系列任务
    steps:
    # 检出代码
    - uses: actions/checkout@v7

    # 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24'  # 使用 Go 1.24 版本，与 go.mod 保持一致
        cache: true  # 启用依赖缓存，提高后续运行速度

    # 验证模块依赖
    - name: Verify dependencies
      run: go mod verify

    # 清理和检查依赖
    - name: Tidy dependencies
      run: go mod tidy

    # 检查代码格式
    - name: Check code formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "代码格式不正确，请运行 gofmt -s -w ."
          gofmt -s -l .
          exit 1
        fi

    # 静态代码分析
    - name: Run go vet
      run: go vet ./...

    # 检查项目是否能正常编译
    - name: Build project
      run: go build ./...

    # 编译示例程序
    - name: Build examples
      run: go build ./examples/...

    # 运行所有单元测试
    - name: Run tests
      run: go test -v ./...

    # 运行竞速检测测试
    - name: Run race tests
      run: go test -race ./...

    # 生成测试覆盖率报告
    # 覆盖率统计分两部分合并，以达到 100% 覆盖：
    # 1. go test -coverprofile：覆盖 pkg/... 与 cmd/... 的 run() 等业务逻辑
    # 2. go build -cover + 运行二进制：覆盖 main()（main 调 os.Exit，测试框架无法调用，
    #    但运行带覆盖率插桩的二进制可覆盖）。GOCOVERDIR 收集 covdata，再 textfmt 转文本。
    # examples/ 和 cmd/skill_verify 调真实网络，不在统计范围。
    - name: Generate coverage report
      run: |
        # (1) 单元测试覆盖率（atomic 模式以便与二进制覆盖合并）
        go test -race -coverprofile=coverage.txt -covermode=atomic \
          -coverpkg=./pkg/...,./cmd/npm-skills,./cmd/mcp-server \
          ./pkg/... ./cmd/npm-skills/ ./cmd/mcp-server/

        # (2) 用 go build -cover 编译带覆盖率插桩的二进制，运行 --help 触发 main()
        mkdir -p /tmp/coverdir bincover
        go build -cover -o bincover/npm-skills ./cmd/npm-skills
        go build -cover -o bincover/npm-mcp-server ./cmd/mcp-server

        # 运行二进制，GOCOVERDIR 收集覆盖数据
        GOCOVERDIR=/tmp/coverdir ./bincover/npm-skills --help >/dev/null 2>&1 || true
        GOCOVERDIR=/tmp/coverdir ./bincover/npm-mcp-server --help >/dev/null 2>&1 || true
        # 错误路径：传业务命令让 run() 走 error 分支（不可达 server）
        GOCOVERDIR=/tmp/coverdir ./bincover/npm-skills package >/dev/null 2>&1 || true

        # (3) covdata 转 coverprofile 文本格式
        go tool covdata textfmt -i=/tmp/coverdir -o /tmp/binary.cover

        # (4) 合并：相同 (file:start,end) 取 count 较大者，保留 numStmts
        awk '
        /^mode:/ {next}
        {
          key=$1; ns=$2; cnt=$3+0
          if(!(key in numstmt)) {numstmt[key]=ns; order[n++]=key}
          if(!(key in maxcnt) || cnt>maxcnt[key]) maxcnt[key]=cnt
        }
        END{
          print "mode: atomic"
          for(i=0;i<n;i++) print order[i], numstmt[order[i]], maxcnt[order[i]]
        }
        ' coverage.txt /tmp/binary.cover > /tmp/merged.cover
        mv /tmp/merged.cover coverage.txt

    # 检查覆盖率阈值
    - name: Check coverage threshold
      run: |
        coverage=$(go tool cover -func=coverage.txt | grep total: | awk '{print $3}' | sed 's/%//')
        echo "当前测试覆盖率: ${coverage}%"
        # 阈值 100%：单元测试覆盖业务逻辑，二进制运行覆盖 main()，
        # 防御性 error 分支已对齐代码库惯例用 _ 忽略（json.Marshal 对纯结构体不会失败等）。
        threshold=100
        if [ "$(echo "$coverage < $threshold" | awk '{print ($1 < $3)}')" = "1" ]; then
          echo "警告：测试覆盖率 (${coverage}%) 低于阈值 (${threshold}%)"
          exit 1
        else
          echo "测试覆盖率 (${coverage}%) 满足要求 (>= ${threshold}%)"
        fi

    # 生成覆盖率HTML报告
    - name: Generate coverage HTML report
      run: go tool cover -html=coverage.txt -o coverage.html

    # 上传覆盖率报告作为artifact
    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: |
          coverage.txt
          coverage.html
        retention-days: 30

    # 上传覆盖率报告到 Codecov（可选）
    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v3
    #   with:
    #     file: ./coverage.txt
    #     fail_ci_if_error: false 