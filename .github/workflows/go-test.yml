name: Go Tests

# 控制工作流何时运行
on:
  # 在推送到任何分支或创建 pull request 时触发
  push:
    branches: [ "*" ]
  pull_request:
    branches: [ "*" ]
  # 允许手动触发工作流
  workflow_dispatch:

# 一个工作流由一个或多个作业组成，这些作业可以顺序或并行运行
jobs:
  # 这个工作流包含一个名为 "test" 的作业
  test:
    # 运行作业的操作系统
    runs-on: ubuntu-latest

    # 步骤代表作业中执行的一系列任务
    steps:
    # 检出代码
    - uses: actions/checkout@v7

    # 设置 Go 环境
    - name: Set up Go
      uses: actions/setup-go@v6
      with:
        go-version: '1.24'  # 使用 Go 1.24 版本，与 go.mod 保持一致
        cache: true  # 启用依赖缓存，提高后续运行速度

    # 验证模块依赖
    - name: Verify dependencies
      run: go mod verify

    # 清理和检查依赖
    - name: Tidy dependencies
      run: go mod tidy

    # 检查代码格式
    - name: Check code formatting
      run: |
        if [ "$(gofmt -s -l . | wc -l)" -gt 0 ]; then
          echo "代码格式不正确，请运行 gofmt -s -w ."
          gofmt -s -l .
          exit 1
        fi

    # 静态代码分析
    - name: Run go vet
      run: go vet ./...

    # 检查项目是否能正常编译
    - name: Build project
      run: go build ./...

    # 编译示例程序
    - name: Build examples
      run: go build ./examples/...

    # 运行所有单元测试
    - name: Run tests
      run: go test -v ./...

    # 运行竞速检测测试
    - name: Run race tests
      run: go test -race ./...

    # 生成测试覆盖率报告
    # 注意：examples/ 和 cmd/skill_verify 是可执行示例/集成测试工具，其 main() 调用真实网络且 os.Exit，
    # 无法在单测中覆盖。这里用 -coverpkg 显式指定统计范围，排除这些 main 包，使覆盖率反映真实代码质量。
    # 两个 cmd 入口（cmd/npm-skills、cmd/mcp-server）的 main() 仅调用 os.Exit(run())，
    # 业务逻辑已抽离为 run() 函数并 100% 覆盖；os.Exit 不可测是 Go 固有限制。
    - name: Generate coverage report
      run: |
        go test -race -coverprofile=coverage.txt -covermode=atomic \
          -coverpkg=./pkg/...,./cmd/npm-skills,./cmd/mcp-server \
          ./pkg/... ./cmd/npm-skills/ ./cmd/mcp-server/

    # 检查覆盖率阈值
    - name: Check coverage threshold
      run: |
        coverage=$(go tool cover -func=coverage.txt | grep total: | awk '{print $3}' | sed 's/%//')
        echo "当前测试覆盖率: ${coverage}%"
        # 设置最低覆盖率阈值为 99%。
        # 剩余 0.4% 为结构性死代码（防御性编程的不可达分支）：
        #   - 2 个 main() 的 os.Exit（Go 语言限制，run() 已 100% 覆盖）
        #   - truncatePackage 第二次 marshal/unmarshal 的 error 分支（同对象首次成功后不可能失败）
        #   - 3 个 ToJsonString 的 json.Marshal error 分支（对纯基本类型结构体不会失败）
        #   - DownloadTarball 的 GetHttpClient err 分支（getBytes 用 requests 库，proxy 非法时先失败）
        threshold=99
        if [ "$(echo "$coverage < $threshold" | awk '{print ($1 < $3)}')" = "1" ]; then
          echo "警告：测试覆盖率 (${coverage}%) 低于阈值 (${threshold}%)"
          exit 1
        else
          echo "测试覆盖率 (${coverage}%) 满足要求 (>= ${threshold}%)"
        fi

    # 生成覆盖率HTML报告
    - name: Generate coverage HTML report
      run: go tool cover -html=coverage.txt -o coverage.html

    # 上传覆盖率报告作为artifact
    - name: Upload coverage reports
      uses: actions/upload-artifact@v7
      with:
        name: coverage-reports
        path: |
          coverage.txt
          coverage.html
        retention-days: 30

    # 上传覆盖率报告到 Codecov（可选）
    # - name: Upload coverage to Codecov
    #   uses: codecov/codecov-action@v3
    #   with:
    #     file: ./coverage.txt
    #     fail_ci_if_error: false 